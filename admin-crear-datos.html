<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Generar Datos</title>
  <link rel="stylesheet" href="estilos-admin.css">
</head>
<body>

  <div class="admin-container">
    <aside class="sidebar">
      <h2>Admin Dashboard</h2>
      <nav>
        <ul>
          <li><a href="#" class="active">Generar Datos</a></li>
          <li><a href="#">Gestionar Usuarios</a></li>
          <li><a href="#">Reportes</a></li>
          <li><a href="#">Configuración</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">
      <header>
        <h1>Añadir Nuevo Registro</h1>
        <p>Módulo exclusivo para administradores para la generación e inserción de nuevos datos.</p>
      </header>

      <section class="form-card">
        <form id="form-generar-datos">
          
          <div class="form-group">
            <label for="tipo-registro">Tipo de Registro:</label>
            <select id="tipo-registro" name="tipo_registro" required>
              <option value="" disabled selected>Seleccione una opción</option>
              <option value="estudiante">Estudiante / Usuario</option>
              <option value="curso">Curso / Materia</option>
              <option value="calificacion">Calificación</option>
            </select>
          </div>

          <!-- Campos dinámicos para el registro -->
          <div class="form-row">
            <div class="form-group">
              <label for="nombre">Nombre Completo / Título:</label>
              <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez o Programación I" required>
            </div>

            <div class="form-group">
              <label for="identificador">Código / Cédula / ID:</label>
              <input type="text" id="identificador" name="identificador" placeholder="Ej. 8-123-4567" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="email">Correo Electrónico:</label>
              <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
            </div>

            <div class="form-group">
              <label for="estado">Estado Inicial:</label>
              <select id="estado" name="estado">
                <option value="activo">Activo</option>
                <option value="inactivo">Inactivo</option>
                <option value="pendiente">Pendiente</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="descripcion">Detalles / Observaciones:</label>
            <textarea id="descripcion" name="descripcion" rows="4" placeholder="Ingrese detalles adicionales..."></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">Guardar Registro</button>
            <button type="reset" class="btn-secondary">Limpiar Formulario</button>
          </div>

        </form>

        <!-- Mensaje de respuesta del sistema -->
        <div id="mensaje-respuesta" class="mensaje hidden"></div>
      </section>
    </main>
  </div>

  <script src="script-admin.js"></script>
</body>
</html>
